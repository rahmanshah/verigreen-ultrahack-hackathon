[project]
name = "verigreen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.4",
    "pandas==3.0.2",
    "pyarrow>=25.0.1",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "qiskit-algorithms==0.4.0",
    "qiskit-optimization==0.7.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "streamlit>=1.65.0",
]
